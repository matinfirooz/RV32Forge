name: RTL CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gcc make python3
      - name: Rebuild assembly and C references
        run: make all
      - name: Run all RTL tests
        run: make sim-all
